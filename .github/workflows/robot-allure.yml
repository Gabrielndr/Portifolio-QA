name: Robot Framework Tests + Allure Report

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: robot-allure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  robot-tests:
    name: Run Robot Framework Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install robotframework
          pip install robotframework-seleniumlibrary
          pip install allure-robotframework

      - name: Run Robot Framework dry run
        run: |
          robot \
            --dryrun \
            --listener allure_robotframework \
            --outputdir Robot/results \
            Robot/tests

      - name: Generate Allure report
        if: always()
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: Robot/results/allure-results
          allure_report: Robot/allure-report
          keep_reports: 20

      - name: Upload Allure artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-allure-results
          path: Robot/allure-report
          retention-days: 30

      - name: Publish Allure report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/main' && always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: Robot/allure-report
          destination_dir: robot
