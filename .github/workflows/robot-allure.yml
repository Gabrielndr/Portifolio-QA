name: Robot Framework Tests + Allure Report

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: robot-allure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  robot-tests:
    name: Run Robot Framework Full Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Show browser versions
        run: |
          which google-chrome || true
          google-chrome --version
          which chromedriver || true
          chromedriver --version || true

      - name: Remove preinstalled ChromeDriver from PATH
        run: |
          if command -v chromedriver >/dev/null 2>&1; then
            CHROMEDRIVER_PATH="$(command -v chromedriver)"
            echo "Removing ChromeDriver from PATH: $CHROMEDRIVER_PATH"
            sudo rm -f "$CHROMEDRIVER_PATH" || rm -f "$CHROMEDRIVER_PATH" || true
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install robotframework
          pip install --upgrade selenium
          pip install robotframework-seleniumlibrary
          pip install allure-robotframework

      - name: Prepare Robot result directories
        run: |
          rm -rf Robot/results Robot/allure-report
          mkdir -p Robot/results/allure-results Robot/allure-report

      - name: Run Robot Framework tests in headless Chrome
        run: |
          robot \
            --variable BROWSER:headlesschrome \
            --listener allure_robotframework:Robot/results/allure-results \
            --outputdir Robot/results \
            Robot/tests

      - name: Check Allure result files
        if: always()
        run: |
          find Robot/results/allure-results -maxdepth 1 -type f -print
          result_count="$(find Robot/results/allure-results -maxdepth 1 -type f | wc -l)"
          test "$result_count" -gt 0

      - name: Generate Allure report
        if: always()
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: Robot/results/allure-results
          allure_report: Robot/allure-report
          keep_reports: 20

      - name: Upload Allure artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-allure-results
          path: |
            Robot/allure-report
            Robot/results
          retention-days: 30

      - name: Publish Allure report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/main' && always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: Robot/allure-report
          destination_dir: robot
