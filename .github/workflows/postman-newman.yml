name: Postman Newman Tests

on:
  push:
    branches: [main]
    paths:
      - 'Postman/**'
      - '.github/workflows/postman-newman.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Postman/**'
      - '.github/workflows/postman-newman.yml'
  workflow_dispatch:

jobs:
  newman:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Postman/package-lock.json

      - name: Install dependencies
        working-directory: Postman
        run: npm ci

      - name: Run Postman collection
        working-directory: Postman
        run: npm run test:ci

      - name: Upload Newman reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postman-newman-reports
          path: Postman/reports/
