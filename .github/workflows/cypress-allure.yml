name: Cypress Tests + Allure Report

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cypress-allure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cypress-tests:
    name: Run Cypress E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25

    defaults:
      run:
        working-directory: Cypress

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Cypress/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run full Cypress suite with Allure reporter
        run: npm run cy:run:ci
        env:
          CYPRESS_CACHE_FOLDER: ~/.cache/Cypress
          TERM: xterm

      - name: Upload Cypress debug artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-debug-artifacts
          path: |
            Cypress/screenshots
            Cypress/videos
          if-no-files-found: ignore
          retention-days: 30

      - name: Generate Allure report
        if: always()
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: Cypress/allure-results
          allure_report: Cypress/allure-report
          allure_history: Cypress/allure-history
          keep_reports: 20

      - name: Upload Allure artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-allure-report
          path: Cypress/allure-report
          retention-days: 30

      - name: Publish Allure report to GitHub Pages
        if: github.ref == 'refs/heads/main' && always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: Cypress/allure-report
          destination_dir: cypress
