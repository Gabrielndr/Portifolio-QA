name: Deploy Portfolio Page

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-index-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-index:
    name: Deploy Index Page
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Publish portfolio page to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: .github/workflows
          destination_dir: .
          keep_files: true
